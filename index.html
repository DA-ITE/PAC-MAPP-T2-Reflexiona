<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>¿Ayudar o resolver? | Instituto SISE</title><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--red:#FF0E49;--dark:#241F21;--gray:#F5F3F4;--line:#E3DFE1;--soft:#FFF1F5}*{box-sizing:border-box}body{margin:0;background:white;color:var(--dark);font:18px/1.35 'Barlow Condensed','Arial Narrow',Arial,sans-serif}main{max-width:1100px;margin:auto;padding:12px}header{background:var(--dark);color:white;border-radius:12px 12px 0 0;border-bottom:4px solid var(--red);padding:17px 22px;display:flex;align-items:center;gap:24px}header img{width:130px;height:auto;flex:none}h1{font-size:32px;line-height:1.05;margin:3px 0}h2{font-size:26px;margin:0 0 8px;line-height:1.1}h3{font-size:21px;margin:0 0 6px}p{margin:0 0 9px}small,.muted{font-size:15px;color:#6A6266}header small{color:white;letter-spacing:1px;font-weight:700}button{font:inherit;cursor:pointer;border:1px solid var(--line);background:white;color:var(--dark);border-radius:8px;padding:10px 15px;font-weight:600}button:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}button:disabled{cursor:not-allowed;opacity:.4}.primary{background:var(--red);color:white;border-color:var(--red)}.route{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:12px 0;scroll-margin-top:8px}.route button{text-align:left;padding:8px 12px;display:flex;align-items:center;gap:8px}.route b{font-size:23px;color:var(--red)}.route .active{background:var(--dark);color:white;border-color:var(--dark)}.route .done{border-color:var(--red)}.panel{border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}.progress{height:6px;border-radius:8px;background:var(--line);overflow:hidden;margin:0 0 12px}.progress span{height:100%;display:block;background:var(--red);transition:width .2s}.scene{display:grid;grid-template-columns:minmax(0, .8fr) minmax(0,1.2fr);gap:20px;align-items:center}.scene img,.compare img{width:100%;height:auto;display:block;border-radius:8px;object-fit:contain}.chat{display:grid;gap:8px;margin:12px 0}.bubble{padding:11px 14px;border-radius:10px;background:var(--gray);max-width:94%;min-width:0}.bubble.teacher{justify-self:end;background:var(--soft);border:1px solid var(--line)}.bubble b{display:block;font-size:15px;margin-bottom:3px}.callout{background:var(--gray);border-left:4px solid var(--red);border-radius:6px;padding:12px 14px;margin:12px 0}.choice{display:flex;gap:10px;align-items:flex-start;padding:11px;border:1px solid var(--line);border-radius:8px;margin:8px 0;cursor:pointer;background:white}.choice:has(input:checked){background:var(--soft);border-color:var(--red)}input{accent-color:var(--red);width:18px;height:18px;flex:none;margin-top:3px}.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:12px}.path{border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}.path header{display:block;border-radius:0;padding:12px 14px;border-bottom:3px solid var(--red)}.path header h3{margin:0;color:white}.path .body{padding:12px}.path img{border-radius:0;max-width:100%;height:auto}.path .chat{min-height:0}.actions{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}.finish{background:var(--dark);color:white;border-left:5px solid var(--red);border-radius:8px;padding:18px;margin-top:14px}.finish h2{color:white}footer{text-align:right;font-size:13px;color:#6A6266;padding:9px 2px}.error{background:var(--soft);border-left:4px solid var(--red);padding:8px 12px;margin-top:10px}.hidden,[hidden]{display:none!important}button:hover:not(:disabled){border-color:var(--red)}@media(max-width:650px){main{padding:7px}header{padding:14px;gap:12px}header img{width:90px}h1{font-size:25px}.route{gap:4px}.route button{padding:6px 3px;display:block;text-align:center;font-size:15px}.route b{display:block;font-size:19px}.scene,.compare{grid-template-columns:1fr}.scene img{max-width:420px;margin:auto}.panel{padding:12px}.path img{max-width:420px;margin:auto}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

/* Contrasta: comparacion compacta, sin recortar ilustraciones. */
.compare .path header{padding:9px 12px}.compare .path header h3{font-size:20px;line-height:1.15}.compare .path .body{padding:10px;display:grid;grid-template-columns:minmax(0, .40fr) minmax(0, .60fr);gap:10px;align-items:start}.compare .path .body>img{width:100%;height:auto;max-width:none;margin:0;border-radius:6px;object-fit:contain;display:block}.compare .path .chat{margin:0;gap:5px;min-width:0}.compare .path .bubble{font-size:17px;line-height:1.25;padding:7px 9px;max-width:100%;border-radius:7px}.compare .path .bubble b{font-size:14px;margin-bottom:2px}.compare .path .callout{grid-column:1/-1;margin:0;padding:8px 10px;font-size:17px;line-height:1.25}.compare .path .callout p{margin-top:2px!important}.compare{align-items:stretch;gap:12px;margin-top:8px}.compare .path{display:flex;flex-direction:column}.compare .path .body{flex:1;grid-template-rows:1fr auto}
@media(max-width:850px) and (min-width:651px){.compare .path .body{grid-template-columns:minmax(0,.32fr) minmax(0,.68fr);gap:7px;padding:8px}.compare .path .bubble{font-size:16px;padding:6px 7px}}
@media(max-width:650px){.compare .path .body{grid-template-columns:minmax(0,.32fr) minmax(0,.68fr);gap:9px}.compare .path .bubble{font-size:16px}.compare .path .body>img{max-width:160px}}
</style></head><body><main><header><img src="assets/logo-sise.png" alt="Instituto SISE"><div><small>REFLEXIONA · MÓDULO 1 · TEMA 2 · 5 MIN</small><h1>¿Ayudar o resolver?</h1><p style="margin:0">Una misma situación, diferentes maneras de acompañar.</p></div></header><nav class="route" id="route" aria-label="Momentos de la actividad"></nav><div class="progress" role="progressbar" aria-label="Avance" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0"><span></span></div><section class="panel" id="panel" aria-labelledby="heading"></section><div class="actions"><button id="back" type="button">‹ Anterior</button><span class="muted" id="stepLabel"></span><button id="next" type="button" class="primary">Continuar ›</button></div><footer>Instituto SISE – Grupo EducaD</footer></main><script>
const DATA={steps:['Conecta','Responde','Contrasta','Reflexiona'],message:'Profesor, últimamente salgo muy tarde del trabajo. Tengo actividades pendientes y no sé por dónde empezar. Siento que no voy a poder terminar el curso.',answers:['Valeria, debes organizar mejor tus horarios. Te recomiendo elaborar un cronograma y cumplirlo.','Valeria, comprendo que estás pasando por una situación difícil. ¿Qué es lo que más te preocupa en este momento?','Valeria, no te preocupes. Envíame tus actividades cuando puedas y veremos cómo ayudarte.'],prompts:['¿Qué sucedería si Valeria no consigue cumplir el cronograma que le has recomendado?','¿Qué harías después de conocer aquello que más le preocupa?','¿Cómo evitarías que esta flexibilidad se traduzca en nuevas actividades pendientes?'],paths:[{title:'Camino 1 · Recibe indicaciones',img:'assets/valeria-02.webp',alt:'Valeria observa su agenda con incertidumbre, sin definir por dónde comenzar.',chat:[['Docente','Organiza tus horarios y empieza por la actividad más antigua.'],['Valeria','Está bien, profesor. Intentaré hacerlo.'],['Docente','Espero que puedas avanzar esta semana.']],result:'Valeria recibe una recomendación, pero todavía no queda claro cómo podrá llevarla a cabo.'},{title:'Camino 2 · Recibe orientación',img:'assets/valeria-03.webp',alt:'Valeria marca una acción concreta en su agenda con tranquilidad.',chat:[['Docente','¿Qué actividad consideras que podrías empezar esta semana?'],['Valeria','Podría avanzar la primera actividad el sábado por la mañana.'],['Docente','¿Te parece si el lunes revisamos cómo te fue?']],result:'Valeria identifica una acción viable y establece un compromiso de seguimiento.'}],checks:['Suelo brindar recomendaciones antes de explorar las dificultades del estudiante.','En ocasiones, asumo que el estudiante sabe cómo llevar a cabo mis orientaciones.','Finalizo conversaciones sin establecer un acuerdo concreto de seguimiento.','Ninguna de las anteriores; procuraré mantener una práctica orientadora.']};
let step=0,max=0,answer=-1,checks=[],finished=false;const $=id=>document.getElementById(id);const panel=$('panel');const bubble=(name,msg)=>`<div class="bubble ${name==='Docente'?'teacher':''}"><b>${name}</b>${msg}</div>`;function scrollRoute(){requestAnimationFrame(()=>$('route').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'}))}function render(){ $('route').innerHTML=DATA.steps.map((s,i)=>`<button type="button" data-step="${i}" class="${i===step?'active':i<max?'done':''}" ${i>max?'disabled':''} ${i===step?'aria-current="step"':''}><b>0${i+1}</b>${s}</button>`).join('');$('stepLabel').textContent=`Momento ${step+1} de 4`;const p=finished?4:step;document.querySelector('.progress span').style.width=(p/4*100)+'%';document.querySelector('.progress').setAttribute('aria-valuenow',p);$('back').disabled=step===0;$('next').textContent=step===3?(finished?'Reiniciar actividad':'Finalizar reflexión'):'Continuar ›';
if(step===0)panel.innerHTML=`<div class="scene"><img src="assets/valeria-01.webp" alt="Valeria, preocupada, responde desde su celular mientras estudia por la noche."><div><h2 id="heading">Valeria pide ayuda</h2><p>En el tema anterior exploraste cómo establecer un primer contacto con un estudiante que necesita acompañamiento.</p><p>Hoy, Valeria ha respondido a tu mensaje.</p><div class="chat">${bubble('Valeria',DATA.message)}</div><div class="callout"><strong>¿Cómo continuarías esta conversación?</strong></div></div></div>`;
if(step===1)panel.innerHTML=`<h2 id="heading">¿Cómo responderías?</h2><div class="chat">${bubble('Valeria',DATA.message)}</div><p>Selecciona la respuesta que más se aproxima a tu práctica docente.</p>${DATA.answers.map((a,i)=>`<label class="choice"><input type="radio" name="answer" value="${i}" ${answer===i?'checked':''}><span>${a}</span></label>`).join('')}<div id="reflection" class="callout" role="status" ${answer<0?'hidden':''}>${answer>=0?'<strong>Ahora reflexiona</strong><br>'+DATA.prompts[answer]:''}</div>`;
if(step===2)panel.innerHTML=`<h2 id="heading">Una conversación, dos caminos</h2><p>Observa dos posibles desenlaces de la misma situación. ¿Qué cambia en la capacidad de Valeria para avanzar?</p><div class="compare">${DATA.paths.map((a,i)=>`<article class="path"><header><h3>${a.title}</h3></header><div class="body"><img src="${a.img}" alt="${a.alt}"><div class="chat">${a.chat.map(x=>bubble(...x)).join('')}</div><div class="callout"><strong>Posible resultado</strong><p style="margin:4px 0 0">${a.result}</p></div></div></article>`).join('')}</div>`;
if(step===3)panel.innerHTML=`<h2 id="heading">Mira tu propia práctica</h2><p>¿Con cuáles de estas situaciones te identificas? Selecciona las que correspondan. No hay respuestas correctas o incorrectas.</p>${DATA.checks.map((a,i)=>`<label class="choice"><input type="checkbox" data-check="${i}" ${checks.includes(i)?'checked':''}><span>${a}</span></label>`).join('')}<div class="finish" ${finished?'':'hidden'} id="closure" role="status"><h2>¿Estamos ayudando a avanzar o solamente indicando qué hacer?</h2><p>En este tema descubrirás cómo convertir una conversación de acompañamiento en una oportunidad para fortalecer la autonomía del estudiante.</p><p style="margin:0">Has completado la reflexión. Continúa con APRENDE en Canvas.</p></div>`;
 document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{step=Number(b.dataset.step);render();scrollRoute()});panel.querySelectorAll('[name=answer]').forEach(r=>r.onchange=()=>{answer=Number(r.value);$('reflection').hidden=false;$('reflection').innerHTML='<strong>Ahora reflexiona</strong><br>'+DATA.prompts[answer];$('error')?.remove()});panel.querySelectorAll('[data-check]').forEach(r=>r.onchange=()=>{let i=Number(r.dataset.check);if(r.checked){checks=i===3?[3]:[...checks.filter(x=>x!==3),i]}else checks=checks.filter(x=>x!==i);finished=false;render();panel.querySelector(`[data-check="${i}"]`).focus()});}
function error(t){$('error')?.remove();const e=document.createElement('div');e.id='error';e.className='error';e.setAttribute('role','alert');e.textContent=t;panel.append(e)}$('back').onclick=()=>{if(step>0){step--;render();scrollRoute()}};$('next').onclick=()=>{if(step===1&&answer<0){error('Selecciona una respuesta para continuar.');return}if(step===3){if(finished){step=0;max=0;answer=-1;checks=[];finished=false;render();scrollRoute();return}if(!checks.length){error('Selecciona una opción para cerrar tu reflexión.');return}finished=true;render();$('closure').scrollIntoView({behavior:'smooth',block:'nearest'});return}step++;max=Math.max(max,step);render();scrollRoute()};render();
</script></body></html>
